[package]
name = "veloren-agent"
version = "1.1.0"
edition = "2024"

[dependencies]
# Veloren client library — same modular frontend lib teloren uses
veloren-client = { git = "https://gitlab.com/veloren/veloren.git", rev = "f97be347c5a7b2b4674c47aa29ff9cc63a85e486" }
veloren-common = { git = "https://gitlab.com/veloren/veloren.git", rev = "f97be347c5a7b2b4674c47aa29ff9cc63a85e486", features = ["no-assets"] }
veloren-common-net = { git = "https://gitlab.com/veloren/veloren.git", rev = "f97be347c5a7b2b4674c47aa29ff9cc63a85e486" }

# Async runtime
tokio = { version = "1", features = ["full"] }

# CLI parsing
clap = { version = "4.5", features = ["derive"] }

# JSON observation output
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Math (re-exported by veloren-client via vek, but handy directly)
vek = { version = "0.17", features = ["serde"] }

# Specs ECS (used by veloren-common for component access)
specs = { version = "0.20", features = ["derive", "shred-derive", "parallel"] }
shred = "0.14"

# Agent-to-Agent (HTTP/WSS) protocol
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
tungstenite = "0.21"
hashbrown = "0.14"

[patch.crates-io]
foldhash = { path = ".vendor/foldhash" }

