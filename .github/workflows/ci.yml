name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    uses: itsdarklikehell/ci-templates/.github/workflows/ci-shell.yml@main
    with:
      shellcheck: true
      shfmt: true
    secrets: inherit

  nightly:
    name: Zero-warning nightly build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install nightly Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
      - name: Cache cargo registry and git checkouts
        uses: actions/cache@v4
        with:
          path: .cargo
          key: cargo-${{ runner.os }}-nightly-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-nightly-
      - name: Cargo build target cache
        uses: actions/cache@v4
        with:
          path: target/
          key: cargo-build-${{ runner.os }}-nightly-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-build-${{ runner.os }}-nightly-
      - name: Fetch dependencies
        env:
          CARGO_HOME: ${{ github.workspace }}/.cargo
        run: cargo fetch
      - name: Patch transitive deps for modern toolchains
        env:
          CARGO_HOME: ${{ github.workspace }}/.cargo
        run: |
          set -euo pipefail
          # Apply the repo-committed toolchain-compatibility patch to the veloren
          # weekly git checkout fetched into the workspace CARGO_HOME after
          # `cargo fetch`. Everything lives inside the repo workspace — no
          # ~/.cargo/git/checkout path dependence (that hardcoded lookup was
          # exactly why the nightly job was fragile).
          VELOREN_SRC="$(find "$CARGO_HOME/git/checkouts" -maxdepth 8 -type f -path '*/common/base/src/userdata_dir.rs' -print -quit)"
          if [ -z "$VELOREN_SRC" ]; then
            echo "::error::veloren weekly checkout not found after cargo fetch" >&2
            exit 1
          fi
          VELOREN_ROOT="$(cd "$(dirname "$VELOREN_SRC")/../../.." && pwd)"
          # Idempotent apply: with a warm Actions cache the checkout may already
          # be patched from a previous run, in which case a plain `git apply`
          # fails ("patch does not apply"). Try the forward apply; skip if the
          # patch is already in place; fail only if neither direction applies
          # (genuine conflict or upstream source drift).
          PATCH="$GITHUB_WORKSPACE/patches/veloren-weekly-toolchain.patch"
          if (cd "$VELOREN_ROOT" && git apply --check "$PATCH"); then
            (cd "$VELOREN_ROOT" && git apply "$PATCH")
          elif (cd "$VELOREN_ROOT" && git apply --reverse --check "$PATCH"); then
            echo "veloren-weekly toolchain patch already applied — skipping"
          else
            echo "::error::veloren-weekly toolchain patch does not apply cleanly" >&2
            exit 1
          fi
          # Registry-crate half (docs/troubleshooting.md workaround 2):
          # shred-0.15.0 removed core::ptr::invalid_mut on modern toolchains.
          SHRED_META="$(find "$CARGO_HOME/registry/src" -type f -path '*/shred-0.15.0/src/meta.rs' -print -quit)"
          if [ -z "$SHRED_META" ]; then
            echo "::error::shred-0.15.0/src/meta.rs not found in cargo registry" >&2
            exit 1
          fi
          sed -i 's|core::ptr::invalid_mut::<R>((self as \*mut Self).addr())|(self as *mut Self).wrapping_add(1).cast::<R>()|' "$SHRED_META"
          # Gate: fail the job if the shred patch did not apply (e.g. upstream source changed)
          if grep -q 'core::ptr::invalid_mut' "$SHRED_META"; then
            echo "::error::shred-0.15.0 toolchain patch did not apply: invalid_mut still present" >&2
            exit 1
          fi
      - name: Build with zero warnings (nightly)
        env:
          CARGO_HOME: ${{ github.workspace }}/.cargo
        run: RUSTFLAGS="-D warnings" cargo +nightly build --release
      - name: Run test suite (nightly)
        env:
          CARGO_HOME: ${{ github.workspace }}/.cargo
        run: RUSTFLAGS="-D warnings" cargo +nightly test --release

  docker-sandbox:
    name: Docker sandbox build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker sandbox image
        run: docker build -t veloren-agent-sandbox .
      - name: Build in sandbox
        run: docker run --rm veloren-agent-sandbox cargo build --release
      - name: Test in sandbox
        run: docker run --rm veloren-agent-sandbox cargo test --release
