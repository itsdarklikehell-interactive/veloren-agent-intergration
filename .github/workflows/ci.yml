name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    uses: itsdarklikehell/ci-templates/.github/workflows/ci-shell.yml@main
    with:
      shellcheck: true
      shfmt: true
    secrets: inherit

  nightly:
    name: Zero-warning nightly build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install nightly Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
      - name: Cache cargo registry and git checkouts
        uses: actions/cache@v4
        with:
          path: ~/.cargo
          key: cargo-${{ runner.os }}-nightly-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-nightly-
      - name: Cargo build target cache
        uses: actions/cache@v4
        with:
          path: target/
          key: cargo-build-${{ runner.os }}-nightly-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-build-${{ runner.os }}-nightly-
      - name: Fetch dependencies
        run: cargo fetch
      - name: Patch transitive deps for modern toolchains
        run: |
          set -euo pipefail
          # veloren-weekly's transitive deps (shred, veloren-common) use APIs
          # removed from modern Rust; apply the project's toolchain-compatibility
          # patches (patches/veloren-weekly-toolchain.patch, see docs/troubleshooting.md).
          # Locate the veloren git checkout dynamically after `cargo fetch`: the
          # weekly tag's rev is not fixed and multiple checkouts may coexist, so
          # hardcoding ~/.cargo/git/checkouts/veloren-*/<rev> is fragile — that
          # hardcoded path is exactly why the nightly job fails in CI.
          VELOREN_SRC="$(find ~/.cargo/git/checkouts -maxdepth 8 -type f -path '*/common/base/src/userdata_dir.rs' -print -quit)"
          if [ -z "$VELOREN_SRC" ]; then
            echo "::error::veloren weekly checkout not found after cargo fetch" >&2
            exit 1
          fi
          VELOREN_ROOT="$(cd "$(dirname "$VELOREN_SRC")/../../.." && pwd)"
          (cd "$VELOREN_ROOT" && git apply "$GITHUB_WORKSPACE/patches/veloren-weekly-toolchain.patch")
          SHRED_META="$(find ~/.cargo/registry/src -type f -path '*/shred-0.15.0/src/meta.rs' -print -quit)"
          if [ -z "$SHRED_META" ]; then
            echo "::error::shred-0.15.0/src/meta.rs not found in cargo registry" >&2
            exit 1
          fi
          sed -i 's|let invalid_ptr = core::ptr::invalid_mut::<R>((self as \*mut Self).addr());|let invalid_ptr = (self as *mut Self).wrapping_add(1).cast::<R>();|' "$SHRED_META"
          # Gate: fail the job if the shred patch did not apply (e.g. upstream source changed)
          if grep -q 'core::ptr::invalid_mut' "$SHRED_META"; then
            echo "::error::shred-0.15.0 toolchain patch did not apply: invalid_mut still present" >&2
            exit 1
          fi
      - name: Build with zero warnings (nightly)
        run: RUSTFLAGS="-D warnings" cargo +nightly build --release
      - name: Run test suite (nightly)
        run: RUSTFLAGS="-D warnings" cargo +nightly test --release

  docker-sandbox:
    name: Docker sandbox build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker sandbox image
        run: docker build -t veloren-agent-sandbox .
      - name: Build in sandbox
        run: docker run --rm veloren-agent-sandbox cargo build --release
      - name: Test in sandbox
        run: docker run --rm veloren-agent-sandbox cargo test --release
