name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    uses: itsdarklikehell-interactive/ci-templates/.github/workflows/ci-shell.yml@main
    with:
      shellcheck: true
      shfmt: true
    secrets: inherit

  nightly:
    name: Zero-warning nightly build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install nightly Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
      - name: Cache cargo registry and git checkouts
        uses: actions/cache@v4
        with:
          path: .cargo
          key: cargo-${{ runner.os }}-nightly-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-nightly-
      - name: Cargo build target cache
        uses: actions/cache@v4
        with:
          path: target/
          key: cargo-build-${{ runner.os }}-nightly-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-build-${{ runner.os }}-nightly-
      - name: Fetch dependencies
        env:
          CARGO_HOME: ${{ github.workspace }}/.cargo
        run: |
          set -euo pipefail
          cargo fetch
      - name: Patch transitive deps for modern toolchains
        env:
          CARGO_HOME: ${{ github.workspace }}/.cargo
        run: |
          set -euo pipefail
          # Find veloren weekly checkout
          VELOREN_SRC=$(find "$CARGO_HOME/git/checkouts" -maxdepth 10 -type f -path '*/common/base/src/userdata_dir.rs' -print -quit)
          if [ -z "$VELOREN_SRC" ]; then
            echo "ERROR: veloren weekly checkout not found after cargo fetch" >&2
            echo "Looking in: $CARGO_HOME/git/checkouts" >&2
            find "$CARGO_HOME/git/checkouts" -maxdepth 10 -type d 2>/dev/null | head -20 >&2
            exit 1
          fi
          VELOREN_ROOT=$(cd "$(dirname "$VELOREN_SRC")/../../.." && pwd)
          echo "Applying patch to: $VELOREN_ROOT"
          PATCH="$GITHUB_WORKSPACE/patches/veloren-weekly-toolchain.patch"
          if [ ! -f "$PATCH" ]; then
            echo "ERROR: patch file not found: $PATCH" >&2
            exit 1
          fi
          # Idempotent apply
          if (cd "$VELOREN_ROOT" && git apply --check "$PATCH" 2>/dev/null); then
            (cd "$VELOREN_ROOT" && git apply "$PATCH")
          elif (cd "$VELOREN_ROOT" && git apply --reverse --check "$PATCH" 2>/dev/null); then
            echo "Patch already applied - skipping"
          else
            echo "ERROR: veloren-weekly toolchain patch does not apply cleanly" >&2
            exit 1
          fi
          # Patch shred crate
          SHRED_META=$(find "$CARGO_HOME/registry/src" -maxdepth 12 -type f -path '*/shred-0.15.0/src/meta.rs' -print -quit)
          if [ -z "$SHRED_META" ]; then
            echo "ERROR: shred-0.15.0/src/meta.rs not found" >&2
            find "$CARGO_HOME/registry/src" -maxdepth 12 -type f -name "meta.rs" 2>/dev/null | head -10 >&2
            exit 1
          fi
          # Replace invalid_mut with wrapping_add workaround
          if grep -q 'core::ptr::invalid_mut' "$SHRED_META"; then
            sed -i 's|core::ptr::invalid_mut::<R>((self as \*mut Self).addr())|((self as *mut Self).wrapping_add(1).cast::<R>())|' "$SHRED_META"
            if grep -q 'core::ptr::invalid_mut' "$SHRED_META"; then
              echo "ERROR: shred patch did not apply" >&2
              exit 1
            fi
            echo "Patched shred crate successfully"
          else
            echo "shred crate already patched or pattern not found"
          fi
      - name: Build with zero warnings (nightly)
        env:
          CARGO_HOME: ${{ github.workspace }}/.cargo
        run: RUSTFLAGS="-D warnings" cargo +nightly build --release
      - name: Run test suite (nightly)
        env:
          CARGO_HOME: ${{ github.workspace }}/.cargo
        run: RUSTFLAGS="-D warnings" cargo +nightly test --release

  docker-sandbox:
    name: Docker sandbox build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker sandbox image
        run: docker build -t veloren-agent-sandbox .
      # The multi-stage Dockerfile already builds and tests with Cargo in its
      # builder stage. The final runtime image intentionally contains only the
      # compiled binary, so smoke-test its CLI rather than invoking Cargo here.
      - name: Smoke-test runtime image
        run: docker run --rm veloren-agent-sandbox --help
